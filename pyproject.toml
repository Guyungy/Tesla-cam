[project]
name = "tesla-cinema-tools"
version = "2.0.0"
description = "Optional Python helpers (SEI tools / experimental PySide6 viewer). Primary app is Electron — see package.json."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "imageio-ffmpeg>=0.5.1",
  "send2trash>=1.8.3",
]

[project.scripts]
tesla-cinema-qt = "tesla_cinema.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tesla_cinema*"]
