name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: |
          pnpm exec tsc -b
          pnpm exec tsc -p tsconfig.electron.json
          pnpm exec vite build

      - name: Package Windows installer
        run: pnpm exec electron-builder --win --config.win.signAndEditExecutable=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.yml
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: |
          pnpm exec tsc -b
          pnpm exec tsc -p tsconfig.electron.json
          pnpm exec vite build

      - name: Package macOS DMG
        run: pnpm exec electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.yml
          retention-days: 5

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/macos

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — Tesla Cinema
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Tesla Cinema ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows | `.exe` installer |
            | macOS (Intel) | `.dmg` (x64) |
            | macOS (Apple Silicon) | `.dmg` (arm64) |

            ### Notes
            - Vehicle metadata (Dashboard) requires Tesla firmware **2025.44.25+** on HW3+
            - See [README](https://github.com/${{ github.repository }}#readme) for full feature list
          files: |
            artifacts/windows/*.exe
            artifacts/macos/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
