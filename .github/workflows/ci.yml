name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck (renderer)
        run: npx tsc -b --noEmit

      - name: Typecheck (electron)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build renderer
        run: npx vite build

      - name: Tests (unit + FFmpeg compose smoke)
        run: npx playwright test
